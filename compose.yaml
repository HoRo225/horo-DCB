services:
  codex:
    build: .
    image: horo-dcb:latest
    logging:
      driver: local
    command: ["python", "-m", "src.codex.bridge", "serve"]
    environment:
      CODEX_HOME: /app/codex
      CODEX_BRIDGE_TOKEN: ${CODEX_BRIDGE_TOKEN}
    volumes:
      - codex-home:/app/codex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/livez')"]
      interval: 60s
      start_interval: 1s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 20s
    restart: unless-stopped

  bot:
    build: .
    image: horo-dcb:latest
    logging:
      driver: local
    env_file: .env
    volumes:
      - data:/app/data
    depends_on:
      codex:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  codex-home:
  data:
