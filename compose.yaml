services:
  bot:
    build: .
    image: horo-dcb-bot:latest
    logging:
      driver: local
    environment:
      DISCORD_GUILD_ID: "361503107168862210"
    volumes:
      - data:/app/data
    secrets:
      - discord_token
    stop_grace_period: 30s
    restart: unless-stopped

secrets:
  discord_token:
    file: ./secrets/discord_token

volumes:
  data:
