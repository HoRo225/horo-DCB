x-runtime: &runtime
  build: .
  image: horo-dcb:local

services:
  bot:
    <<: *runtime
    env_file:
      - .env
    command: ["python", "-m", "src.bot"]
    restart: unless-stopped
    stop_grace_period: 40s
    volumes:
      - bot_data_srv:/app/data

  codex:
    <<: *runtime
    command: ["python", "-m", "src.ai.bridge", "serve"]
    environment:
      CODEX_BRIDGE_TOKEN: ${CODEX_BRIDGE_TOKEN}
      CODEX_HOME: /app/codex
    restart: unless-stopped
    volumes:
      - codex_data_srv:/app/codex
      - type: bind
        source: /srv/horo-dcb-data/deployment
        target: /run/horo-dcb-update
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/livez', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  bot_data_srv:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/horo-dcb-data/bot
  codex_data_srv:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/horo-dcb-data/codex
