name: bootstrap-test

on:
  push:
    branches:
      - feat/bootstrap-discord-bot
    paths:
      - horo_dcb/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/bootstrap-lock.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.10.0
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run python -m unittest discover -s tests -v
