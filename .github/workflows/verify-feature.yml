name: verify-feature

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-feature.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bootstrap-discord-bot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.10.0
      - name: Check dependency lock
        run: uv lock --check
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Compile Python
        run: uv run python -m compileall -q horo_dcb tests
      - name: Run tests
        run: uv run python -m unittest discover -s tests -v
      - name: Prepare fake runtime secret
        run: |
          mkdir -p .secrets
          printf 'ci-test-token\n' > .secrets/discord_token
          git check-ignore -q .secrets/discord_token
      - name: Validate Compose
        run: docker compose config -q
      - name: Build container
        run: docker compose build
      - name: Verify secret isolation and non-root runtime
        run: |
          docker compose run --rm --no-deps --entrypoint sh bot -c '
            test -s /run/secrets/discord_token &&
            test ! -e /app/.secrets/discord_token &&
            test "$(id -u)" != "0"
          '
