name: Codex CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Codex CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - run: python -m pip install -r requirements.txt ruff==0.16.9
      - run: python -m pip check
      - run: ruff check src ops
      - name: Parse all production Python
        run: python -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8'),filename=str(p)) for base in ('src','ops') for p in pathlib.Path(base).rglob('*.py')]"
      - run: python ops/image_metadata.py --check-sdk
      - run: docker build --tag horo-dcb:check .
      - run: docker run --rm horo-dcb:check python -m src.ai.bridge --help
