name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Exercise fresh-clone setup
        run: |
          set -eu
          sh scripts/setup.sh
          test "$(stat -c '%a' .env)" = "600"
          token=$(sed -n 's/^CODEX_BRIDGE_TOKEN=//p' .env)
          test "${#token}" -eq 64
          test -z "$(printf '%s' "$token" | tr -d '0-9a-f')"

          before=$(sha256sum .env)
          sh scripts/setup.sh
          test "$before" = "$(sha256sum .env)"

          if sh scripts/check-env.sh; then
            echo "check-env unexpectedly accepted the Discord token placeholder" >&2
            exit 1
          fi
          sed -i 's/DISCORD_TOKEN=\[REDACTED_SECRET\]/DISCORD_TOKEN=configured-for-ci/' .env
          sh scripts/check-env.sh

          sed -i             -e 's/^CODEX_ENABLED=.*/CODEX_ENABLED=1/'             -e 's/^CODEX_ALLOWED_GUILD_ID=.*/CODEX_ALLOWED_GUILD_ID=1/'             -e 's/^CODEX_ALLOWED_CHANNEL_ID=.*/CODEX_ALLOWED_CHANNEL_ID=/'             -e 's/^CODEX_ALLOWED_USER_IDS=.*/CODEX_ALLOWED_USER_IDS=/'             .env
          sh scripts/check-env.sh
          sed -i 's/^CODEX_ALLOWED_CHANNEL_ID=.*/CODEX_ALLOWED_CHANNEL_ID=0/' .env
          if sh scripts/check-env.sh; then
            echo "check-env unexpectedly accepted an invalid channel seed" >&2
            exit 1
          fi
          sed -i 's/^CODEX_ALLOWED_CHANNEL_ID=.*/CODEX_ALLOWED_CHANNEL_ID=/' .env
          sed -i 's/^CODEX_ALLOWED_USER_IDS=.*/CODEX_ALLOWED_USER_IDS=3,3/' .env
          if sh scripts/check-env.sh; then
            echo "check-env unexpectedly accepted duplicate allowlist users" >&2
            exit 1
          fi
          sed -i 's/^CODEX_ALLOWED_USER_IDS=.*/CODEX_ALLOWED_USER_IDS=/' .env

      - name: Validate Compose isolation
        run: |
          docker compose config --format json > /tmp/horo-compose.json
          python - <<'PY'
          import json

          with open("/tmp/horo-compose.json", encoding="utf-8") as source:
              model = json.load(source)
          bot = model["services"]["bot"]
          codex = model["services"]["codex"]
          assert bot["image"] == codex["image"]
          assert "ports" not in codex
          assert {item["target"] for item in bot["volumes"]} == {"/app/data"}
          assert {item["target"] for item in codex["volumes"]} == {"/app/codex"}
          assert "CODEX_HOME" not in bot["environment"]
          assert set(codex["environment"]) == {"CODEX_HOME", "CODEX_BRIDGE_TOKEN"}
          assert "DISCORD_TOKEN" not in codex["environment"]
          assert "9router" not in json.dumps(model).lower()
          PY

      - name: Build shared image
        run: docker compose build --pull --build-arg VCS_REF="$GITHUB_SHA" bot

      - name: Verify image provenance
        run: |
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' horo-dcb:local)" = "https://github.com/HoRo225/horo-DCB"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' horo-dcb:local)" = "$GITHUB_SHA"

      - name: Run regression suite
        run: docker compose run --rm -T --no-deps bot python -m unittest discover -s tests -v

      - name: Verify runtime
        run: |
          if docker compose run --rm -T --no-deps bot python -m pip --version; then
            echo "runtime image unexpectedly contains pip" >&2
            exit 1
          fi
          docker compose run --rm -T --no-deps bot python -m src.preflight
          docker compose run --rm -T --no-deps -e PYTHONPYCACHEPREFIX=/tmp/pycache bot python -m compileall -q src tests
          docker compose run --rm -T --no-deps bot sh -eu -c '
            sdk_version=$(sed -n "s/^openai-codex==//p" /app/requirements.txt)
            cli_version=$(sed -n "s/^openai-codex-cli-bin==//p" /app/requirements.txt)
            test -n "$sdk_version"
            test -n "$cli_version"
            python -c "import openai_codex, sys; assert openai_codex.__version__ == sys.argv[1]" "$sdk_version"
            test "$(codex --version)" = "codex-cli $cli_version"
          '

      - name: Export tested candidate image
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="horo-dcb-bot-reliability-${GITHUB_SHA}"
          artifact_dir="${RUNNER_TEMP}/${artifact_name}"
          archive="${artifact_name}.tar.gz"
          candidate="horo-dcb-bot:reliability-${GITHUB_SHA}"
          inspect_file="${RUNNER_TEMP}/${artifact_name}-inspect.json"

          mkdir "$artifact_dir"
          docker tag horo-dcb:local "$candidate"
          docker image inspect "$candidate" > "$inspect_file"
          python - "$inspect_file" "$artifact_dir/image-identity.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          image = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))[0]
          labels = image["Config"].get("Labels") or {}
          identity = {
              "image_id": image["Id"],
              "repo_tags": image.get("RepoTags") or [],
              "repo_digests": image.get("RepoDigests") or [],
              "created": image["Created"],
              "architecture": image["Architecture"],
              "os": image["Os"],
              "rootfs_layers": image["RootFS"]["Layers"],
              "source": labels["org.opencontainers.image.source"],
              "revision": labels["org.opencontainers.image.revision"],
          }
          Path(sys.argv[2]).write_text(
              json.dumps(identity, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          rm "$inspect_file"

          docker save "$candidate" | gzip -1 > "$artifact_dir/$archive"
          test -s "$artifact_dir/$archive"
          (
            cd "$artifact_dir"
            sha256sum "$archive" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Upload tested candidate image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: horo-dcb-bot-reliability-${{ github.sha }}
          path: ${{ runner.temp }}/horo-dcb-bot-reliability-${{ github.sha }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
