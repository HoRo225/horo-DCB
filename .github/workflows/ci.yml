name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Exercise fresh-clone setup
        run: |
          set -eu
          sh scripts/setup.sh
          test "$(stat -c '%a' .env)" = "600"
          token=$(sed -n 's/^CODEX_BRIDGE_TOKEN=//p' .env)
          test "${#token}" -eq 64
          test -z "$(printf '%s' "$token" | tr -d '0-9a-f')"

          before=$(sha256sum .env)
          sh scripts/setup.sh
          test "$before" = "$(sha256sum .env)"

          if sh scripts/check-env.sh; then
            echo "check-env unexpectedly accepted the Discord token placeholder" >&2
            exit 1
          fi
          sed -i 's/DISCORD_TOKEN=\[REDACTED_SECRET\]/DISCORD_TOKEN=configured-for-ci/' .env
          sh scripts/check-env.sh

          sed -i             -e 's/^CODEX_ENABLED=.*/CODEX_ENABLED=1/'             -e 's/^CODEX_ALLOWED_GUILD_ID=.*/CODEX_ALLOWED_GUILD_ID=1/'             -e 's/^CODEX_ALLOWED_CHANNEL_ID=.*/CODEX_ALLOWED_CHANNEL_ID=2/'             -e 's/^CODEX_ALLOWED_USER_IDS=.*/CODEX_ALLOWED_USER_IDS=3,4/'             .env
          sh scripts/check-env.sh
          sed -i 's/^CODEX_ALLOWED_USER_IDS=.*/CODEX_ALLOWED_USER_IDS=3,3/' .env
          if sh scripts/check-env.sh; then
            echo "check-env unexpectedly accepted duplicate allowlist users" >&2
            exit 1
          fi
          sed -i 's/^CODEX_ALLOWED_USER_IDS=.*/CODEX_ALLOWED_USER_IDS=3,4/' .env

      - name: Validate Compose isolation
        run: |
          docker compose config --format json > /tmp/horo-compose.json
          python - <<'PY'
          import json

          with open("/tmp/horo-compose.json", encoding="utf-8") as source:
              model = json.load(source)
          bot = model["services"]["bot"]
          codex = model["services"]["codex"]
          assert bot["image"] == codex["image"]
          assert "ports" not in codex
          assert {item["target"] for item in bot["volumes"]} == {"/app/data"}
          assert {item["target"] for item in codex["volumes"]} == {"/app/codex"}
          assert "CODEX_HOME" not in bot["environment"]
          assert set(codex["environment"]) == {"CODEX_HOME", "CODEX_BRIDGE_TOKEN"}
          assert "DISCORD_TOKEN" not in codex["environment"]
          assert "9router" not in json.dumps(model).lower()
          PY

      - name: Build shared image
        run: docker compose build --pull bot

      - name: Run regression suite
        run: docker compose run --rm -T --no-deps bot python -m unittest discover -s tests -v

      - name: Verify runtime
        run: |
          if docker compose run --rm -T --no-deps bot python -m pip --version; then
            echo "runtime image unexpectedly contains pip" >&2
            exit 1
          fi
          docker compose run --rm -T --no-deps bot python -m src.preflight
          docker compose run --rm -T --no-deps -e PYTHONPYCACHEPREFIX=/tmp/pycache bot python -m compileall -q src tests
          docker compose run --rm -T --no-deps bot python -c 'import openai_codex; assert openai_codex.__version__ == "0.147.0"'
          docker compose run --rm -T --no-deps bot sh -c 'test "$(codex --version)" = "codex-cli 0.147.0"'
