name: Staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to stage
        required: true
        default: main

permissions:
  contents: read

jobs:
  live-smoke:
    name: live-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      HORO_DCB_IMAGE: horo-dcb:staging-${{ github.run_id }}
      DISCORD_TOKEN: ${{ secrets.STAGING_DISCORD_TOKEN }}
      CODEX_ENABLED: "1"
      CODEX_ALLOWED_GUILD_ID: ${{ secrets.STAGING_GUILD_ID }}
      CODEX_BRIDGE_TOKEN: ${{ secrets.STAGING_CODEX_BRIDGE_TOKEN }}
      STAGING_CODEX_DIR: ${{ runner.temp }}/horo-dcb-staging-codex
      COMPOSE_PROJECT_NAME: horo-dcb-staging-${{ github.run_id }}
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}

      - name: Test and build
        run: |
          docker build --target test --build-arg VCS_REF="$GITHUB_SHA" .
          docker build --target runtime --build-arg VCS_REF="$GITHUB_SHA" -t "$HORO_DCB_IMAGE" .

      - name: Prepare ephemeral Codex state
        env:
          CODEX_AUTH_B64: ${{ secrets.STAGING_CODEX_AUTH_B64 }}
          CODEX_PROMPT_B64: ${{ secrets.STAGING_CODEX_PROMPT_B64 }}
        run: |
          test -n "$DISCORD_TOKEN"
          test -n "$CODEX_ALLOWED_GUILD_ID"
          test -n "$CODEX_BRIDGE_TOKEN"
          test -n "$CODEX_AUTH_B64"
          test -n "$CODEX_PROMPT_B64"
          install -d -m 700 "$STAGING_CODEX_DIR"
          printf '%s' "$CODEX_AUTH_B64" | base64 --decode > "$STAGING_CODEX_DIR/auth.json"
          printf '%s' "$CODEX_PROMPT_B64" | base64 --decode > "$STAGING_CODEX_DIR/base_instructions.txt"
          chmod 600 "$STAGING_CODEX_DIR/auth.json" "$STAGING_CODEX_DIR/base_instructions.txt"
          sudo chown -R 10001:10001 "$STAGING_CODEX_DIR"

      - name: Start isolated staging services
        run: docker compose -f compose.yaml -f .github/staging.compose.yaml up -d

      - name: Verify staging services
        run: |
          i=0
          while test $i -lt 12; do
            bot_id=$(docker compose -f compose.yaml -f .github/staging.compose.yaml ps -q bot)
            codex_id=$(docker compose -f compose.yaml -f .github/staging.compose.yaml ps -q codex)
            if test -n "$bot_id" && test -n "$codex_id" \
              && test "$(docker inspect -f '{{.State.Running}}' "$bot_id")" = true \
              && test "$(docker inspect -f '{{.State.Health.Status}}' "$codex_id")" = healthy; then
              exit 0
            fi
            i=$((i + 1))
            sleep 10
          done
          exit 1

      - name: Hold for live Discord verification
        run: sleep 300

      - name: Destroy staging state
        if: always()
        run: |
          docker compose -f compose.yaml -f .github/staging.compose.yaml down --volumes --remove-orphans || true
          docker image rm "$HORO_DCB_IMAGE" || true
          sudo rm -rf "$STAGING_CODEX_DIR"
