[project]
name = "horo-dcb"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp>=3.13,<4",
    "discord.py==2.7.1",
    "pillow>=13,<14",
]

[project.optional-dependencies]
codex = ["openai-codex-cli-bin==0.167.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/horo_dcb"]
