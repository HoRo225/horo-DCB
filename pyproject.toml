[project]
name = "horo-dcb"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp>=3.13,<4",
    "discord.py==2.7.1",
]

[project.optional-dependencies]
codex = ["openai-codex-cli-bin==0.167.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/horo_dcb"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = ["--strict-markers", "--import-mode=importlib", "-p", "no:cacheprovider"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ty.src]
include = ["src", "scripts"]

[tool.ty.rules]
missing-union-attribute = "ignore"
